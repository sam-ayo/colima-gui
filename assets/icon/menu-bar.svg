<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36">
  <!-- The status item icon: the volcano and the containers of the app icon
       in one color. macOS uses it as a template image, so only the alpha
       counts. The ribs of the containers are holes. -->
  <defs>
    <mask id="ribs">
      <rect width="36" height="36" fill="#fff"/>
      <g stroke="#000" stroke-width="1.6" stroke-linecap="round">
        <line x1="15" y1="15.5" x2="15" y2="18.5"/>
        <line x1="18" y1="15.5" x2="18" y2="18.5"/>
        <line x1="21" y1="15.5" x2="21" y2="18.5"/>
        <line x1="19.5" y1="7.5" x2="19.5" y2="9.5"/>
        <line x1="22.5" y1="7.5" x2="22.5" y2="9.5"/>
      </g>
    </mask>
  </defs>
  <path d="M1 35 C7 31 11 26 13.5 22.5 Q18 24.5 22.5 22.5 C25 26 29 31 35 35 Z"/>
  <g mask="url(#ribs)">
    <rect x="11.5" y="13" width="13" height="8" rx="1.8"/>
    <rect x="16" y="5" width="10" height="7" rx="1.5" opacity="0.8"/>
    <rect x="11" y="0.5" width="7" height="3.5" rx="1.2" opacity="0.55"/>
  </g>
</svg>

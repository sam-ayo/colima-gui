<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36">
  <!-- The status item icon: the stack of containers of the app icon in one
       color. macOS uses it as a template image, so only the alpha counts.
       The mask cuts the edges of each container, from the back to the
       front, so a front container hides the edges of the containers behind
       it. -->
  <defs>
    <mask id="edges" maskUnits="userSpaceOnUse" x="0" y="0" width="36" height="36">
      <g stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
      <polygon points="26.1,10.7 34.3,15.4 34.3,24.8 26.1,29.5 18,24.8 18,15.4" fill="#fff" stroke="#000"/>
      <path d="M34.3,15.4 L26.1,20.1 L18,15.4 M26.1,20.1 L26.1,29.5" fill="none" stroke="#000"/>
      <polygon points="9.9,10.7 18,15.4 18,24.8 9.9,29.5 1.7,24.8 1.7,15.4" fill="#fff" stroke="#000"/>
      <path d="M18,15.4 L9.9,20.1 L1.7,15.4 M9.9,20.1 L9.9,29.5" fill="none" stroke="#000"/>
      <polygon points="18,15.4 26.1,20.1 26.1,29.5 18,34.2 9.9,29.5 9.9,20.1" fill="#fff" stroke="#000"/>
      <path d="M26.1,20.1 L18,24.8 L9.9,20.1 M18,24.8 L18,34.2" fill="none" stroke="#000"/>
      <polygon points="18,1.3 26.1,6 26.1,15.4 18,20.1 9.9,15.4 9.9,6" fill="#fff" stroke="#000"/>
      <path d="M26.1,6 L18,10.7 L9.9,6 M18,10.7 L18,20.1" fill="none" stroke="#000"/>
      </g>
    </mask>
  </defs>
  <g mask="url(#edges)">
    <polygon points="26.1,10.7 34.3,15.4 34.3,24.8 26.1,29.5 18,24.8 18,15.4"/>
    <polygon points="9.9,10.7 18,15.4 18,24.8 9.9,29.5 1.7,24.8 1.7,15.4"/>
    <polygon points="18,15.4 26.1,20.1 26.1,29.5 18,34.2 9.9,29.5 9.9,20.1"/>
    <polygon points="18,1.3 26.1,6 26.1,15.4 18,20.1 9.9,15.4 9.9,6"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- App icon for colima-gui: containers stacked into a volcano (Colima),
       with a hot container on top. This file is a template. The app fills
       the color tokens (names in double braces) from the accent color and
       the appearance (see src/ui/app_icon.rs). scripts/icon.sh fills them
       with the default colors for the bundle icon.

       The stack has the shapes of the menu bar icon (menu-bar.svg), in its
       36-unit coordinates. The "edges" mask is the same as in that file, so
       both icons have the same gaps between the containers. -->
  <defs>
    <style>
      .face { stroke-width: 0.3; stroke-linejoin: round; }
      .glass-top { fill: {{glass_top}}; stroke: {{glass_top}}; }
      .glass-left { fill: {{glass_left}}; stroke: {{glass_left}}; }
      .glass-right { fill: {{glass_right}}; stroke: {{glass_right}}; }
      .hot-top { fill: {{hot_top}}; stroke: {{hot_top}}; }
      .hot-left { fill: {{hot_left}}; stroke: {{hot_left}}; }
      .hot-right { fill: {{hot_right}}; stroke: {{hot_right}}; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="{{bg_start}}"/>
      <stop offset="0.55" stop-color="{{bg_middle}}"/>
      <stop offset="1" stop-color="{{bg_end}}"/>
    </linearGradient>
    <radialGradient id="glow" cx="512" cy="430" r="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="{{glow}}" stop-opacity="{{glow_opacity}}"/>
      <stop offset="1" stop-color="{{glow}}" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="edges" maskUnits="userSpaceOnUse" x="0" y="0" width="36" height="36">
      <g stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
        <polygon points="26.1,10.7 34.3,15.4 34.3,24.8 26.1,29.5 18,24.8 18,15.4" fill="#fff" stroke="#000"/>
        <path d="M34.3,15.4 L26.1,20.1 L18,15.4 M26.1,20.1 L26.1,29.5" fill="none" stroke="#000"/>
        <polygon points="9.9,10.7 18,15.4 18,24.8 9.9,29.5 1.7,24.8 1.7,15.4" fill="#fff" stroke="#000"/>
        <path d="M18,15.4 L9.9,20.1 L1.7,15.4 M9.9,20.1 L9.9,29.5" fill="none" stroke="#000"/>
        <polygon points="18,15.4 26.1,20.1 26.1,29.5 18,34.2 9.9,29.5 9.9,20.1" fill="#fff" stroke="#000"/>
        <path d="M26.1,20.1 L18,24.8 L9.9,20.1 M18,24.8 L18,34.2" fill="none" stroke="#000"/>
        <polygon points="18,1.3 26.1,6 26.1,15.4 18,20.1 9.9,15.4 9.9,6" fill="#fff" stroke="#000"/>
        <path d="M26.1,6 L18,10.7 L9.9,6 M18,10.7 L18,20.1" fill="none" stroke="#000"/>
      </g>
    </mask>
    <clipPath id="tile">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
    <filter id="drop" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="lift" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="{{shadow}}" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#drop)">
    <g clip-path="url(#tile)">
      <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>
      <circle cx="512" cy="430" r="340" fill="url(#glow)"/>
      <g filter="url(#lift)">
        <g transform="translate(269 275) scale(13.5)" mask="url(#edges)">
          <polygon class="face glass-left" points="18,15.4 26.1,20.1 26.1,29.5 18,24.8"/>
          <polygon class="face glass-right" points="26.1,20.1 34.3,15.4 34.3,24.8 26.1,29.5"/>
          <polygon class="face glass-top" points="26.1,10.7 34.3,15.4 26.1,20.1 18,15.4"/>
          <polygon class="face glass-left" points="1.7,15.4 9.9,20.1 9.9,29.5 1.7,24.8"/>
          <polygon class="face glass-right" points="9.9,20.1 18,15.4 18,24.8 9.9,29.5"/>
          <polygon class="face glass-top" points="9.9,10.7 18,15.4 9.9,20.1 1.7,15.4"/>
          <polygon class="face glass-left" points="9.9,20.1 18,24.8 18,34.2 9.9,29.5"/>
          <polygon class="face glass-right" points="18,24.8 26.1,20.1 26.1,29.5 18,34.2"/>
          <polygon class="face glass-top" points="18,15.4 26.1,20.1 18,24.8 9.9,20.1"/>
          <polygon class="face hot-left" points="9.9,6 18,10.7 18,20.1 9.9,15.4"/>
          <polygon class="face hot-right" points="18,10.7 26.1,6 26.1,15.4 18,20.1"/>
          <polygon class="face hot-top" points="18,1.3 26.1,6 18,10.7 9.9,6"/>
        </g>
      </g>
      <rect x="100" y="100" width="824" height="824" fill="url(#sheen)"/>
    </g>
    <rect x="101.5" y="101.5" width="821" height="821" rx="184" fill="none" stroke="#fff" stroke-opacity="0.18" stroke-width="3"/>
  </g>
</svg>

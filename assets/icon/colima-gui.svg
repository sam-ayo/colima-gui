<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- App icon for colima-gui: containers stacked into a volcano (Colima),
       with a hot container on top. This file is a template. The app fills
       the color tokens (names in double braces) from the accent color and
       the appearance (see src/ui/app_icon.rs). scripts/icon.sh fills them
       with the default colors for the bundle icon. -->
  <defs>
    <style>
      polygon { stroke-width: 14; stroke-linejoin: round; }
      .glass-top { fill: {{glass_top}}; stroke: {{glass_top}}; }
      .glass-left { fill: {{glass_left}}; stroke: {{glass_left}}; }
      .glass-right { fill: {{glass_right}}; stroke: {{glass_right}}; }
      .hot-top { fill: {{hot_top}}; stroke: {{hot_top}}; }
      .hot-left { fill: {{hot_left}}; stroke: {{hot_left}}; }
      .hot-right { fill: {{hot_right}}; stroke: {{hot_right}}; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="{{bg_start}}"/>
      <stop offset="0.55" stop-color="{{bg_middle}}"/>
      <stop offset="1" stop-color="{{bg_end}}"/>
    </linearGradient>
    <radialGradient id="glow" cx="512" cy="430" r="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="{{glow}}" stop-opacity="{{glow_opacity}}"/>
      <stop offset="1" stop-color="{{glow}}" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="tile">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
    <filter id="drop" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="lift" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="{{shadow}}" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#drop)">
    <g clip-path="url(#tile)">
      <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>
      <circle cx="512" cy="430" r="340" fill="url(#glow)"/>
      <g filter="url(#lift)">
        <polygon class="glass-left" points="526.5,493.8 633.2,555.4 633.2,678.6 526.5,617.0"/>
        <polygon class="glass-right" points="739.9,493.8 633.2,555.4 633.2,678.6 739.9,617.0"/>
        <polygon class="glass-top" points="633.2,432.2 739.9,493.8 633.2,555.4 526.5,493.8"/>
        <polygon class="glass-left" points="284.1,493.8 390.8,555.4 390.8,678.6 284.1,617.0"/>
        <polygon class="glass-right" points="497.5,493.8 390.8,555.4 390.8,678.6 497.5,617.0"/>
        <polygon class="glass-top" points="390.8,432.2 497.5,493.8 390.8,555.4 284.1,493.8"/>
        <polygon class="glass-left" points="405.3,563.8 512.0,625.4 512.0,748.6 405.3,687.0"/>
        <polygon class="glass-right" points="618.7,563.8 512.0,625.4 512.0,748.6 618.7,687.0"/>
        <polygon class="glass-top" points="512.0,502.2 618.7,563.8 512.0,625.4 405.3,563.8"/>
        <polygon class="hot-left" points="405.3,353.8 512.0,415.4 512.0,538.6 405.3,477.0"/>
        <polygon class="hot-right" points="618.7,353.8 512.0,415.4 512.0,538.6 618.7,477.0"/>
        <polygon class="hot-top" points="512.0,292.2 618.7,353.8 512.0,415.4 405.3,353.8"/>
      </g>
      <rect x="100" y="100" width="824" height="824" fill="url(#sheen)"/>
    </g>
    <rect x="101.5" y="101.5" width="821" height="821" rx="184" fill="none" stroke="#fff" stroke-opacity="0.18" stroke-width="3"/>
  </g>
</svg>

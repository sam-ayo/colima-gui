[package]
name = "colima-gui"
version = "0.1.7"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-channel = "2.5.0"
base64 = "0.22"
bollard = "0.21"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
ed25519-dalek = "2"
futures = "0.3.34"
gpui-component = "0.7"
gpui-kit-assets = "0.7"
gpui-pre = "=0.3.7"
gpui-pre-platform = { version = "=0.3.7", features = ["runtime_shaders", "font-kit"] }
indexmap = "2.14.2"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

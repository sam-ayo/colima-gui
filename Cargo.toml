[package]
name = "colima-gui"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-channel = "2.5.0"
bollard = "0.21"
futures = "0.3.34"
gpui-component = "0.7"
gpui-kit-assets = "0.7"
gpui-pre = "=0.3.7"
gpui-pre-platform = { version = "=0.3.7", features = ["runtime_shaders", "font-kit"] }
indexmap = "2.14.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
